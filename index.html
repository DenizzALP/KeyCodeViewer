<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display: flex;
            flex-wrap: wrap;
            flex-direction: column;
            align-items: center;
        }
        .text{
            margin-top: 200px;
            width: 40%;
            height: 100px;
            box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.3);
        }
        .keyCode{
            width: 10%;
            height: 100px;
            margin-top: 50px;
            box-shadow: 10px 10px 15px rgba(0, 0, 0, 0.3);
            display: none; 
            
        }
        .title{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
        }
        .number{
            text-align: center;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 2.5rem ;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="text">
            <h1 class="title">Klavyenizdeki bir tusa basin</h1>
        </div>
        <div class="keyCode">
            <h1 class="number">10</h1>
        </div>
    </div>
    <script>
        document.body.addEventListener('keydown', e=>{
            console.log(e)
            console.log(e.key)//hangi tusa bastigini soyluyoruz
            console.log(e.keyCode)//tusun kodunu soyluyoruz

            const keyCode = document.querySelector('.keyCode')
            keyCode.style.display = 'block';
            
            const title = document.querySelector('.title')
            const number = document.querySelector('.number')

            let key = e.key
            let keyC = e.keyCode
            if(key === ' '){
                title.innerHTML = `<span style="color: green;">space</span> Tusuna Bastiniz`
                number.textContent = `${keyC}`
                number.style.color = 'green'
            }else{
                title.innerHTML = `<span style="color: green;">${key}</span> Tusuna Bastiniz`
                number.textContent = `${keyC}`
                number.style.color = 'green'
            }
            
        })
    </script>
</body>
</html>
